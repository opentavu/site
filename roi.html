<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What are lost leads costing you? · Opentavu</title>
<meta name="description" content="Estimate with your own numbers what unanswered leads and manual CRM work cost your business every month.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://opentavu.com/roi.html">
<meta property="og:title" content="What are lost leads costing you? · Opentavu">
<meta property="og:description" content="Estimate with your own numbers what unanswered leads and manual CRM work cost your business every month.">
<meta property="og:image" content="https://opentavu.com/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{--accent:#0F6CBD;--accent2:#0A4E88;--ink:#16202b;--muted:#5a6b7b;--line:#e4e9ef;--bg:#ffffff;--soft:#f5f8fc;--good:#127a3e;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;}
  body{background:var(--soft);color:var(--ink);line-height:1.5;padding:32px 16px;}
  .wrap{max-width:1060px;margin:0 auto;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .topright{display:flex;align-items:center;gap:14px;}
  a.brand{font-size:20px;font-weight:800;letter-spacing:-.4px;color:var(--ink);text-decoration:none;}
  a.brand b{color:var(--accent);}
  .back{color:var(--muted);font-size:13px;font-weight:600;text-decoration:none;}
  .back:hover{color:var(--accent);}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .lang button{border:0;background:#fff;color:var(--muted);font-size:12px;font-weight:700;padding:5px 10px;cursor:pointer;}
  .lang button.on{background:var(--accent);color:#fff;}
  .head{margin-bottom:22px;}
  .eyebrow{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;}
  h1{font-size:29px;letter-spacing:-.5px;margin-top:6px;}
  .sub{color:var(--muted);font-size:15px;margin-top:8px;max-width:760px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px;align-items:stretch;}
  .col{display:flex;flex-direction:column;}
  @media(max-width:840px){.grid{grid-template-columns:1fr;}}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;}
  .card h2{font-size:16px;margin-bottom:4px;}
  .card .hint{color:var(--muted);font-size:12.5px;margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;}
  .field .lh{color:var(--muted);font-weight:400;font-size:12px;}
  .field input[type=number]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;color:var(--ink);}
  .field input:focus{outline:none;border-color:var(--accent);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end;}
  .res{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:16px;padding:24px;flex:1;display:flex;flex-direction:column;}
  .res h2{color:#fff;font-size:16px;margin-bottom:16px;opacity:.95;}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .kpi{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:14px;}
  .kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;opacity:.85;}
  .kpi .v{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.5px;}
  .kpi.big{grid-column:1 / -1;background:#fff;color:var(--accent2);}
  .kpi.big .v{font-size:30px;}
  .bdlabel{margin-top:16px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;opacity:.85;}
  .bd{margin-top:8px;background:rgba(255,255,255,.10);border-radius:12px;padding:14px;font-size:13px;}
  .bd .li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.14);}
  .bd .li:last-child{border-bottom:0;font-weight:700;}
  .cta{display:block;text-align:center;margin-top:auto;background:#fff;color:var(--accent);font-weight:700;padding:12px;border-radius:10px;text-decoration:none;font-size:14px;}
  .note{color:rgba(255,255,255,.82);font-size:11.5px;margin-top:16px;line-height:1.5;}
  .note b{color:#fff;}
  .foot{margin-top:22px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .foot b{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="index.html">open<b>tavu</b></a>
    <div class="topright">
      <a class="back" href="index.html" data-i18n="back">← Home</a>
      <span class="lang">
        <button data-lang="en">EN</button>
        <button data-lang="es">ES</button>
      </span>
    </div>
  </div>

  <div class="head">
    <div class="eyebrow" data-i18n="eyebrow">Lost sales calculator</div>
    <h1 data-i18n="h1">What are lost leads costing you?</h1>
    <p class="sub" data-i18n="sub"></p>
  </div>

  <div class="grid">
    <div class="col">
      <div class="card">
        <h2 data-i18n="c1h"></h2>
        <div class="hint" data-i18n="c1hint"></div>
        <div class="field">
          <label data-i18n="l_leads"></label>
          <input type="number" id="leads" value="30" min="0" step="5">
        </div>
        <div class="row2">
        <div class="field">
          <label data-i18n="l_unanswered"></label>
          <input type="number" id="unanswered" value="20" min="0" max="100" step="5">
        </div>
        <div class="field">
          <label data-i18n="l_closeRate"></label>
          <input type="number" id="closeRate" value="15" min="0" max="100" step="1">
        </div>
        </div>
        <div class="field">
          <label data-i18n="l_ticket"></label>
          <input type="number" id="ticket" value="2500" min="0" step="100">
        </div>
      </div>

      <div class="card" style="margin-top:20px;">
        <h2 data-i18n="c2h"></h2>
        <div class="hint" data-i18n="c2hint"></div>
        <div class="row2">
        <div class="field">
          <label data-i18n="l_hours"></label>
          <input type="number" id="hours" value="2" min="0" step="0.5">
        </div>
        <div class="field">
          <label data-i18n="l_team"></label>
          <input type="number" id="team" value="5" min="1" step="1">
        </div>
        </div>
        <div class="field">
          <label data-i18n="l_rate"></label>
          <input type="number" id="rate" value="30" min="0" step="5">
        </div>
      </div>
    </div>

    <div class="col">
      <div class="res">
        <h2 data-i18n="resh"></h2>
        <div class="kpis">
          <div class="kpi big"><div class="l" data-i18n="kYear"></div><div class="v" id="totYear">-</div></div>
          <div class="kpi"><div class="l" data-i18n="kLost"></div><div class="v" id="lost">-</div></div>
          <div class="kpi"><div class="l" data-i18n="kManual"></div><div class="v" id="manualCost">-</div></div>
        </div>
        <div class="bdlabel" data-i18n="bdLabel"></div>
        <div class="bd">
          <div class="li"><span data-i18n="bLostLeads"></span><span id="lostLeads">-</span></div>
          <div class="li"><span data-i18n="bLostDeals"></span><span id="lostDeals">-</span></div>
          <div class="li"><span data-i18n="bLost"></span><span id="lost2">-</span></div>
          <div class="li"><span data-i18n="bHours"></span><span id="manualHours">-</span></div>
          <div class="li"><span data-i18n="bManual"></span><span id="manualCost2">-</span></div>
          <div class="li"><span data-i18n="bTotMonth"></span><span id="totMonth">-</span></div>
        </div>
        <div style="height:16px"></div>
        <a class="cta" href="https://outlook.office365.com/book/Opentavu@opentavu.com/" target="_blank" rel="noopener" data-i18n="cta">Book a diagnosis</a>
        <p class="note" data-i18n="note"></p>
      </div>
    </div>
  </div>

  <div class="foot">
    <div><b>open</b>tavu · opentavu.com</div>
    <div data-i18n="footnote"></div>
  </div>
</div>

<script>
  var $=function(id){return document.getElementById(id);};
  var L='en';
  var WEEKS_PER_MONTH=4.33;

  var T = {
    en:{
      title:"What are lost leads costing you? · Opentavu", back:"← Home",
      eyebrow:"Lost sales calculator", h1:"What are lost leads costing you?",
      sub:"Put in your own numbers and see what slow replies and manual work cost you every month. The defaults are conservative; change any of them.",
      c1h:"Your leads", c1hint:"How many come in and what happens to them.",
      l_leads:'Leads per month <span class="lh">(inquiries from every channel)</span>',
      l_unanswered:'Leads without a reply in 24 h (%) <span class="lh">assumption</span>',
      l_closeRate:'Your usual close rate (%) <span class="lh">of leads that get answered</span>',
      l_ticket:'Average ticket <span class="lh">(USD per closed sale)</span>',
      c2h:"Your team's manual work", c2hint:"Time spent typing into the CRM or spreadsheets instead of selling.",
      l_hours:'Hours per week on manual entry <span class="lh">per person</span>',
      l_team:'Team size <span class="lh">(people)</span>',
      l_rate:'Loaded hourly cost <span class="lh">(USD per hour, with benefits)</span>',
      resh:"What it costs you today",
      kYear:"Total per year", kLost:"Lost sales per month", kManual:"Manual work per month",
      bdLabel:"How we got there, every month",
      bLostLeads:"Leads without a timely reply", bLostDeals:"Sales those leads would have closed", bLost:"Lost sales",
      bHours:"Hours of manual entry", bManual:"Cost of those hours", bTotMonth:"Total per month",
      cta:"Book a diagnosis",
      note:"This is an estimate with your own numbers. The diagnosis replaces it with real ones.",
      footnote:"Assumes an unanswered lead would have closed at your usual rate. Figures in USD.",
      hoursUnit:"h"
    },
    es:{
      title:"¿Cuánto te cuestan los leads que se pierden? · Opentavu", back:"← Inicio",
      eyebrow:"Calculadora de ventas perdidas", h1:"¿Cuánto te cuestan los leads que se pierden?",
      sub:"Pon tus propios números y mira cuánto te cuestan cada mes las respuestas lentas y el trabajo manual. Los valores iniciales son conservadores; cambia el que quieras.",
      c1h:"Tus leads", c1hint:"Cuántos entran y qué pasa con ellos.",
      l_leads:'Leads por mes <span class="lh">(consultas de todos los canales)</span>',
      l_unanswered:'Leads sin respuesta en 24 h (%) <span class="lh">supuesto</span>',
      l_closeRate:'Tu tasa de cierre habitual (%) <span class="lh">de los leads que sí se atienden</span>',
      l_ticket:'Ticket promedio <span class="lh">(USD por venta cerrada)</span>',
      c2h:"El trabajo manual de tu equipo", c2hint:"Tiempo escribiendo en el CRM o en hojas de cálculo en lugar de vender.",
      l_hours:'Horas a la semana en registro manual <span class="lh">por persona</span>',
      l_team:'Tamaño del equipo <span class="lh">(personas)</span>',
      l_rate:'Costo por hora con prestaciones <span class="lh">(USD por hora)</span>',
      resh:"Lo que te cuesta hoy",
      kYear:"Total al año", kLost:"Ventas que se escapan al mes", kManual:"Trabajo manual al mes",
      bdLabel:"Cómo llegamos a la cifra, cada mes",
      bLostLeads:"Leads sin respuesta a tiempo", bLostDeals:"Ventas que esos leads habrían cerrado", bLost:"Ventas que se escapan",
      bHours:"Horas de registro manual", bManual:"Costo de esas horas", bTotMonth:"Total al mes",
      cta:"Agenda un diagnóstico",
      note:"Es una estimación con tus números. El diagnóstico la cambia por números reales.",
      footnote:"Supone que un lead sin respuesta habría cerrado a tu tasa habitual. Cifras en USD.",
      hoursUnit:"h"
    }
  };

  function money(n){ if(!isFinite(n)) return '-'; return '$'+Math.round(n).toLocaleString('en-US'); }
  function dec(n){ var s=(Math.round(n*10)/10).toString(); return L==='es'?s.replace('.',','):s; }
  function num(id){ var v=parseFloat($(id).value); return isNaN(v)||v<0?0:v; }
  function pct(id){ return Math.min(100,num(id))/100; }

  function calc(){
    var t=T[L];
    var lostLeads=num('leads')*pct('unanswered');
    var lostDeals=lostLeads*pct('closeRate');
    var lost=lostDeals*num('ticket');
    var hoursMonth=num('hours')*num('team')*WEEKS_PER_MONTH;
    var manual=hoursMonth*num('rate');
    var month=lost+manual;
    $('lostLeads').textContent=dec(lostLeads);
    $('lostDeals').textContent=dec(lostDeals);
    $('lost').textContent=money(lost); $('lost2').textContent=money(lost);
    $('manualHours').textContent=Math.round(hoursMonth)+' '+t.hoursUnit;
    $('manualCost').textContent=money(manual); $('manualCost2').textContent=money(manual);
    $('totMonth').textContent=money(month);
    $('totYear').textContent=money(month*12);
  }

  function setLang(lang){
    L=(lang==='es')?'es':'en'; var t=T[L];
    document.documentElement.lang=L; document.title=t.title;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var k=el.getAttribute('data-i18n'); if(t[k]!==undefined) el.innerHTML=t[k];
    });
    document.querySelectorAll('.lang button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-lang')===L); });
    try{ localStorage.setItem('otlang', L); }catch(e){}
    calc();
  }

  document.querySelectorAll('input').forEach(function(i){ i.addEventListener('input',calc); i.addEventListener('change',calc); });
  document.querySelectorAll('.lang button').forEach(function(b){
    b.addEventListener('click',function(){ setLang(b.getAttribute('data-lang')); });
  });

  // init: respect the language chosen on the main site
  var saved=''; try{ saved=localStorage.getItem('otlang')||''; }catch(e){}
  var lang0 = (saved==='en'||saved==='es') ? saved : ((navigator.language||'en').toLowerCase().indexOf('es')===0?'es':'en');
  setLang(lang0);
</script>
</body>
</html>
